# Inside Airbnb city configuration.
#
# snapshot_date: the scrape date shown on insideairbnb.com/get-the-data (YYYY-MM-DD).
# All URLs are copied verbatim from the official download page.
# Do not construct or guess URLs; use only what appears on that page.

cities:
  amsterdam:
    name: "Amsterdam"
    country: "Netherlands"
    snapshot_date: "2026-06-15"
    files:
      listings_detailed:    "https://data.insideairbnb.com/the-netherlands/north-holland/amsterdam/2026-06-15/data/listings.csv.gz"
      listings_summary:     "https://data.insideairbnb.com/the-netherlands/north-holland/amsterdam/2026-06-15/visualisations/listings.csv"
      calendar:             "https://data.insideairbnb.com/the-netherlands/north-holland/amsterdam/2026-06-15/data/calendar.csv.gz"
      reviews_detailed:     "https://data.insideairbnb.com/the-netherlands/north-holland/amsterdam/2026-06-15/data/reviews.csv.gz"
      reviews_summary:      "https://data.insideairbnb.com/the-netherlands/north-holland/amsterdam/2026-06-15/visualisations/reviews.csv"
      neighbourhoods:       "https://data.insideairbnb.com/the-netherlands/north-holland/amsterdam/2026-06-15/visualisations/neighbourhoods.csv"
      neighbourhoods_geojson: "https://data.insideairbnb.com/the-netherlands/north-holland/amsterdam/2026-06-15/visualisations/neighbourhoods.geojson"

  # A second city can be added here with no Python code changes required.
