# City configuration for the Inside Airbnb market intelligence pipeline.
#
# Each city entry contains the exact snapshot date and the official download URLs.
# The configuration is the authoritative source of truth for ingestion.
# Do not infer URLs from filenames or construct them programmatically.
#
# Required fields per city:
#   name          Human-readable city name (used in reports and output paths)
#   country       Country or region (used in documentation only)
#   snapshot_date ISO-8601 date of the Inside Airbnb scrape (YYYY-MM-DD)
#   files         Mapping of file keys to official download URLs
#
# Required file keys: listings_detailed, listings_summary, calendar,
#   reviews_detailed, reviews_summary, neighbourhoods, neighbourhoods_geojson
#
# Optional file keys: any additional city-specific file the pipeline
#   should download. Document the reason in docs/data_dictionary.md.

cities:
  amsterdam:
    name: "Amsterdam"
    country: "Netherlands"
    snapshot_date: ""           # TODO: fill in after confirming on insideairbnb.com/get-the-data/
    files:
      listings_detailed: ""     # TODO: paste exact URL from download page
      listings_summary: ""      # TODO: paste exact URL from download page
      calendar: ""              # TODO: paste exact URL from download page
      reviews_detailed: ""      # TODO: paste exact URL from download page
      reviews_summary: ""       # TODO: paste exact URL from download page
      neighbourhoods: ""        # TODO: paste exact URL from download page
      neighbourhoods_geojson: ""# TODO: paste exact URL from download page

